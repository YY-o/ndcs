<!DOCTYPE html>

<style>
:root{--bg:#171027;--panel:#211735;--gold:#d9b65b;--gold2:#f4df9b;--lav:#d9c8f2;--muted:#aa9abf;--line:rgba(217,182,91,.34);--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;color:#f8f0ff;font-family:"PingFang SC","Microsoft YaHei","Noto Serif SC",serif;background:radial-gradient(ellipse at 18% 8%,rgba(180,130,230,.18),transparent 32%),radial-gradient(ellipse at 85% 28%,rgba(212,175,55,.13),transparent 30%),linear-gradient(155deg,#1d1530,#100a1d 75%);overflow-x:hidden}

#particles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
button{font:inherit}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.app{position:relative;z-index:1;width:min(100% - 28px,520px);margin:0 auto;padding:16px 0 calc(30px + env(safe-area-inset-bottom))}

.header{text-align:center;padding:26px 8px 16px}
.eyebrow{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--gold2);font:11px Georgia,serif;letter-spacing:4px}

.subtitle{font-size:13px;line-height:1.8;letter-spacing:1px;color:var(--lav)}
.panel{border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 18px 45px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.08);position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;inset:9px;border:1px solid rgba(217,182,91,.12);border-radius:15px;pointer-events:none}
.page{display:none;animation:rise .45s var(--ease) both}
.page.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.intro{padding:32px 24px;text-align:center}
.seal{width:94px;height:94px;margin:0 auto 20px;border:1px solid rgba(244,223,155,.7);border-radius:26px;display:grid;place-items:center;color:var(--gold2);font-size:48px;transform:rotate(45deg);box-shadow:0 0 32px rgba(217,182,91,.15),inset 0 0 24px rgba(217,182,91,.08)}

.intro h2{font-size:24px;letter-spacing:3px;color:#fff2c8;margin:26px 0 12px}
.intro p{color:var(--lav);font-size:14px;line-height:2;margin:0 auto 24px;max-width:360px}
.btn{border:0;border-radius:13px;padding:14px 18px;min-height:48px;cursor:pointer;transition:transform .2s,filter .2s,box-shadow .2s;letter-spacing:2px}
.btn:active{transform:scale(.98)}
.primary{color:#21152e;font-weight:700;background:linear-gradient(120deg,#d4ae50,#f5e3a5 50%,#c79b3c);box-shadow:0 8px 24px rgba(190,145,53,.22)}
.secondary{color:#f6eaff;background:rgba(255,255,255,.055);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.full{width:100%}
.progress-wrap{margin:6px 4px 16px}
.progress-meta{display:flex;justify-content:space-between;color:#d6c7e9;font-size:12px;margin-bottom:8px}
.track{height:6px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden;border:1px solid rgba(217,182,91,.2)}
.fill{height:100%;width:0;background:linear-gradient(90deg,#b88b36,#f5e3a5,#d2a74b);box-shadow:0 0 12px rgba(217,182,91,.5);transition:width .35s}
.question-card{padding:24px 20px 20px}
.q-label{color:var(--gold);font:11px Georgia,serif;letter-spacing:4px;margin-bottom:13px}
.question{font-size:17px;line-height:1.85;color:#fff;margin-bottom:20px}
.options{display:grid;gap:11px}
.option{width:100%;text-align:left;color:#f2e9ff;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:13px 13px;line-height:1.7;font-size:14px;cursor:pointer;position:relative;transition:background .2s,border-color .2s,transform .2s}

.option:hover,.option.selected{background:rgba(217,182,91,.1);border-color:rgba(217,182,91,.65)}
.option.selected:before{opacity:1}
.letter{display:inline-grid;place-items:center;width:25px;height:25px;margin-right:8px;border-radius:8px;background:linear-gradient(135deg,#d9b65b,#a477c2);color:#241632;font-weight:800;font-size:12px;vertical-align:middle}
.navrow{display:flex;gap:10px;margin-top:16px}
.navrow .btn{flex:1}
.dots{display:flex;justify-content:center;gap:7px;margin:16px 0 4px}
.dot{width:6px;height:6px;border-radius:9px;background:rgba(255,255,255,.2);transition:all .25s}
.dot.active{width:20px;background:var(--gold)}
.result{padding:26px 22px;text-align:center}
.crown{font-size:44px;filter:drop-shadow(0 0 12px rgba(217,182,91,.35));margin-bottom:6px}
.result-kicker{font:11px Georgia,serif;color:var(--gold);letter-spacing:4px}
.result h2{font-size:25px;letter-spacing:2px;color:#fff0c7;margin:12px 0 8px}
.result-sub{font-size:13px;color:var(--lav);margin-bottom:18px}
.result-text{text-align:left;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;color:#e9def7;font-size:14px;line-height:1.95}
.scoreline{color:var(--gold2);font-size:13px;letter-spacing:1px;margin:14px 0}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.metric{background:rgba(255,255,255,.045);border:1px solid rgba(217,182,91,.18);border-radius:12px;padding:11px;text-align:left}
.metric-head{display:flex;justify-content:space-between;font-size:12px;color:#e8dcf6;margin-bottom:8px}
.metric-head b{color:var(--gold2)}
.meter{height:5px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#9871c5,#e3c36f);border-radius:9px}
.analysis{font-size:12px;color:#c9b8df;line-height:1.8;text-align:left;margin:12px 0 0}
.actions{display:grid;gap:10px;margin-top:19px}
.tip{color:#ad9bbb;font-size:11px;letter-spacing:1px;margin-top:15px}
.hidden{display:none!important}
#posterCanvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;background:#1b1230}
.poster-wrap{margin-top:16px;text-align:left}
.poster-wrap p{font-size:12px;color:var(--muted);margin:8px 0}
.footer{text-align:center;color:rgba(255,255,255,.28);font-size:10px;letter-spacing:2px;margin-top:20px}
@media(max-width:360px){.app{width:calc(100% - 20px)}.question-card{padding:20px 15px}.question{font-size:16px}.option{font-size:13px;padding:12px}.result{padding:23px 16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

const state={index:0,answers:Array(QUESTIONS.length).fill(null),scores:null,profile:null};
const $=id=>document.getElementById(id);
const pages=["introPage","quizPage","resultPage"];
function showPage(id){pages.forEach(p=>$(p).classList.toggle("active",p===id));window.scrollTo({top:0,behavior:"smooth"});}
function renderQuestion(){
 const q=QUESTIONS[state.index];$("qLabel").textContent=`QUESTION ${String(state.index+1).padStart(2,"0")}`;
 $("questionText").textContent=q.q;$("progressIndex").textContent=`第 ${state.index+1} 题`;
 $("progressFill").style.width=`${(state.index+1)/QUESTIONS.length*100}%`;
 $("options").innerHTML="";
 q.a.forEach((item,i)=>{const b=document.createElement("button");b.type="button";b.className="option"+(state.answers[state.index]===i?" selected":"");b.innerHTML=`<span class="letter">${"ABCD"[i]}</span>`;const t=document.createTextNode(item[0]);b.appendChild(t);b.addEventListener("click",()=>{state.answers[state.index]=i;renderQuestion();playTone(620,.07);});$("options").appendChild(b);});
 $("prevBtn").disabled=state.index===0;$("prevBtn").style.opacity=state.index===0?".45":"1";
 $("nextBtn").disabled=state.answers[state.index]===null;
 $("nextBtn").textContent=state.index===QUESTIONS.length-1?"揭晓我的女帝人格":"确认选择";
 $("dots").innerHTML=QUESTIONS.map((_,i)=>`<span class="dot ${i===state.index?"active":""}"></span>`).join("");
}
function calculate(){
 const keys=Object.keys(LABELS),raw={devotion:0,power:0,balance:0,romance:0};
 state.answers.forEach((answer,qi)=>{const s=QUESTIONS[qi].a[answer][1];keys.forEach(k=>raw[k]+=s[k]);});
 // 每个维度独立归一化到 0-100：以该维度九题可得最高分为基准
 const max={devotion:36,power:36,balance:36,romance:36};
 const normalized={};keys.forEach(k=>normalized[k]=Math.round(raw[k]/max[k]*100));
 state.scores=normalized;
 // 主导人格优先按归一化得分；并列时使用固定顺序保证结果稳定
 const order=["devotion","balance","power","romance"];
 let winner=order[0];order.forEach(k=>{if(normalized[k]>normalized[winner])winner=k;});
 state.profile=PROFILES.find(p=>p.key===winner);
}
function showResult(){
 calculate();const p=state.profile;$("resultIcon").textContent=p.icon;$("resultTitle").textContent=p.title;$("resultTag").textContent=p.tag;$("resultText").textContent=p.text;
 const sum=state.answers.reduce((a,v)=>a+v+1,0);$("scoreLine").textContent=`九题已完成 · 选择倾向值 ${sum} / 36`;
 $("metrics").innerHTML=Object.entries(LABELS).map(([k,label])=>`<div class="metric"><div class="metric-head"><span>${label}</span><b>${state.scores[k]}%</b></div><div class="meter"><i style="width:${state.scores[k]}%"></i></div></div>`).join("");
 const sorted=Object.entries(state.scores).sort((a,b)=>b[1]-a[1]);$("dominantLine").textContent=`你的主导倾向是「${LABELS[sorted[0][0]]}」，其次是「${LABELS[sorted[1][0]]}」。四维数值呈现本次作答的相对倾向，并非心理诊断。`;
 showPage("resultPage");playTone(760,.14);setTimeout(()=>playTone(960,.18),140);
}
$("startBtn").addEventListener("click",()=>{playTone(520,.09);state.index=0;showPage("quizPage");renderQuestion();});
$("prevBtn").addEventListener("click",()=>{if(state.index>0){state.index--;renderQuestion();}});
$("nextBtn").addEventListener("click",()=>{if(state.answers[state.index]===null)return;if(state.index<QUESTIONS.length-1){state.index++;renderQuestion();}else showResult();});
$("restartBtn").addEventListener("click",()=>{state.index=0;state.answers.fill(null);state.scores=null;state.profile=null;$("posterWrap").classList.add("hidden");showPage("introPage");});
function resultText(){const p=state.profile;return `【大朝女帝 · ${p.title}】\n${p.tag}\n${p.text}\n\n四维人格：${Object.entries(LABELS).map(([k,v])=>`${v} ${state.scores[k]}%`).join("｜")}\n\n大朝女帝 · 九道抉择，窥见帝王本心`;}
$("copyBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(resultText());$("copyBtn").textContent="已复制结果";}catch(e){fallbackCopy(resultText());$("copyBtn").textContent="已尝试复制";}setTimeout(()=>$("copyBtn").textContent="复制结果文字",1800);});
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();}
$("shareBtn").addEventListener("click",async()=>{const data={title:"我的大朝女帝人格",text:resultText()};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(resultText());$("shareBtn").textContent="结果已复制，可粘贴分享";setTimeout(()=>$("shareBtn").textContent="分享我的女帝人格",2000);}}catch(e){}});
function drawPoster(){
 const c=$("posterCanvas"),ctx=c.getContext("2d"),p=state.profile,s=state.scores;
 const g=ctx.createLinearGradient(0,0,900,1200);g.addColorStop(0,"#302047");g.addColorStop(.55,"#1b1230");g.addColorStop(1,"#10091d");ctx.fillStyle=g;ctx.fillRect(0,0,900,1200);
 const glow=ctx.createRadialGradient(450,270,20,450,270,460);glow.addColorStop(0,"rgba(217,182,91,.23)");glow.addColorStop(1,"rgba(217,182,91,0)");ctx.fillStyle=glow;ctx.fillRect(0,0,900,700);
 ctx.strokeStyle="rgba(232,199,119,.75)";ctx.lineWidth=3;ctx.strokeRect(35,35,830,1130);ctx.strokeStyle="rgba(232,199,119,.3)";ctx.lineWidth=1;ctx.strokeRect(52,52,796,1096);
 ctx.textAlign="center";ctx.fillStyle="#e6c879";ctx.font="26px serif";ctx.fillText("大 朝 皇 室  ·  帝 王 档 案",450,120);
 ctx.font="112px serif";ctx.fillText(p.icon,450,300);
 ctx.fillStyle="#fff0c8";ctx.font="bold 52px serif";ctx.fillText(p.title,450,405);
 ctx.fillStyle="#d7bf8d";ctx.font="26px serif";ctx.fillText(p.tag,450,460);
 ctx.strokeStyle="rgba(232,199,119,.45)";ctx.beginPath();ctx.moveTo(150,510);ctx.lineTo(750,510);ctx.stroke();
 const keys=Object.keys(LABELS);keys.forEach((k,i)=>{const y=590+i*105;ctx.textAlign="left";ctx.fillStyle="#eadfcf";ctx.font="28px serif";ctx.fillText(LABELS[k],150,y);ctx.textAlign="right";ctx.fillStyle="#f2d78f";ctx.fillText(s[k]+"%",750,y);ctx.fillStyle="rgba(255,255,255,.12)";roundRect(ctx,150,y+20,600,12,6);ctx.fill();const bar=ctx.createLinearGradient(150,0,750,0);bar.addColorStop(0,"#9b72c4");bar.addColorStop(1,"#e5c36e");ctx.fillStyle=bar;roundRect(ctx,150,y+20,600*s[k]/100,12,6);ctx.fill();});
 ctx.textAlign="center";ctx.fillStyle="#d9c9e8";ctx.font="23px serif";wrapText(ctx,p.text,450,1030,650,38,2);
 ctx.fillStyle="#b99d61";ctx.font="20px Georgia,serif";ctx.fillText("TAMI  ·  THE EMPRESS TEST",450,1120);
 $("posterWrap").classList.remove("hidden");$("posterWrap").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){let line="",lines=[];for(const ch of text){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;}else line=test;}if(line)lines.push(line);lines=lines.slice(0,maxLines);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));}
$("posterBtn").addEventListener("click",drawPoster);
$("downloadBtn").addEventListener("click",()=>{const a=document.createElement("a");a.download="大朝女帝-我的人格档案.png";a.href=$("posterCanvas").toDataURL("image/png");a.click();});

// Web Audio：可听见的古风五声音阶氛围配乐 + 轻柔交互音效
// 采用浏览器实时合成，不需要外链音频；首次播放必须由用户点击触发。
let audioCtx = null;
let musicOn = false;
let musicTimer = null;
let musicStep = 0;
let masterGain = null;
let activeNodes = [];

function ensureAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) {
      $("soundBtn").textContent = "当前浏览器不支持音频";
      return null;
    }
    audioCtx = new AudioContextClass();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.72;
    masterGain.connect(audioCtx.destination);
  }
  return audioCtx;
}

async function unlockAudio() {
  const ctx = ensureAudio();
  if (!ctx) return false;
  try {
    if (ctx.state !== "running") await ctx.resume();
    return ctx.state === "running";
  } catch (err) {
    console.warn("音频启动失败：", err);
    return false;
  }
}

function playNote(freq, when, duration, volume, type = "sine") {
  const ctx = audioCtx;
  if (!ctx || !masterGain) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, when);
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(type === "triangle" ? 1800 : 2600, when);
  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), when + 0.035);
  gain.gain.setTargetAtTime(0.0001, when + duration * 0.45, Math.max(0.08, duration * 0.22));

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start(when);
  osc.stop(when + duration + 0.5);
  activeNodes.push(osc);
  osc.onended = () => {
    osc.disconnect();
    filter.disconnect();
    gain.disconnect();
    activeNodes = activeNodes.filter(node => node !== osc);
  };
}

function playMusicPhrase() {
  if (!musicOn || !audioCtx || audioCtx.state !== "running") return;

  // D 宫五声音阶：柔和、空灵的古风旋律
  const scale = [293.66, 329.63, 392.00, 440.00, 587.33, 440.00, 392.00, 329.63];
  const bass = [146.83, 196.00, 220.00, 196.00];
  const now = audioCtx.currentTime + 0.04;
  const beat = 0.62;

  // 每四拍铺一层柔和低音，避免单纯低频嗡鸣
  if (musicStep % 4 === 0) {
    const base = bass[(musicStep / 4) % bass.length];
    playNote(base, now, 2.15, 0.055, "sine");
    playNote(base * 1.5, now + 0.025, 1.65, 0.018, "triangle");
  }

  // 主旋律：钟磬般的清亮音色，音量比背景铺底更明显
  const note = scale[musicStep % scale.length];
  playNote(note, now, 0.9, 0.105, "sine");

  // 偶尔加入高八度点缀，形成轻盈的宫廷氛围
  if (musicStep % 4 === 2) {
    playNote(note * 2, now + 0.12, 0.58, 0.026, "triangle");
  }

  musicStep++;
}

function startMusic() {
  if (!musicOn) return;
  if (musicTimer) clearInterval(musicTimer);
  playMusicPhrase();
  musicTimer = setInterval(playMusicPhrase, 620);
}

function stopMusic() {
  musicOn = false;
  if (musicTimer) {
    clearInterval(musicTimer);
    musicTimer = null;
  }
  if (masterGain && audioCtx) {
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.12);
    setTimeout(() => {
      if (!musicOn && masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(0.72, audioCtx.currentTime);
      }
    }, 500);
  }
}

function playTone(freq = 660, duration = 0.1) {
  if (!musicOn || !audioCtx || audioCtx.state !== "running") return;
  playNote(freq, audioCtx.currentTime + 0.01, duration, 0.075, "triangle");
}

$("soundBtn").addEventListener("click", async () => {
  if (musicOn) {
    stopMusic();
    $("soundBtn").textContent = "♫ 开启宫廷配乐";
    $("soundBtn").setAttribute("aria-pressed", "false");
    return;
  }

  musicOn = true;
  const ready = await unlockAudio();
  if (!ready) {
    musicOn = false;
    $("soundBtn").textContent = "点击重试开启音乐";
    return;
  }

  // 先恢复总音量，再开始旋律；这一步发生在真实点击手势之后
  masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  masterGain.gain.setValueAtTime(0.72, audioCtx.currentTime);
  startMusic();
  playTone(783.99, 0.18);
  $("soundBtn").textContent = "♫ 关闭宫廷配乐";
  $("soundBtn").setAttribute("aria-pressed", "true");
});

document.addEventListener("visibilitychange", async () => {
  if (document.hidden && musicOn) {
    if (musicTimer) clearInterval(musicTimer);
    musicTimer = null;
  } else if (!document.hidden && musicOn) {
    const ready = await unlockAudio();
    if (ready) startMusic();
  }
});

// 轻量粒子：限制数量并响应减少动态效果设置
const canvas=$("particles"),pctx=canvas.getContext("2d");let particles=[],raf=0;
function resizeCanvas(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";pctx.setTransform(dpr,0,0,dpr,0,0);particles=Array.from({length:Math.min(34,Math.floor(innerWidth/12))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.8+.5,v:Math.random()*.32+.08,a:Math.random()*.45+.12,phase:Math.random()*6}));}
function animate(){pctx.clearRect(0,0,innerWidth,innerHeight);particles.forEach(p=>{p.y-=p.v;p.x+=Math.sin(p.y*.012+p.phase)*.18;if(p.y<-5){p.y=innerHeight+5;p.x=Math.random()*innerWidth;}pctx.beginPath();pctx.arc(p.x,p.y,p.r,0,Math.PI*2);pctx.fillStyle=`rgba(236,203,124,${p.a})`;pctx.fill();});raf=requestAnimationFrame(animate);}
resizeCanvas();addEventListener("resize",resizeCanvas);
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)animate();
</script>
